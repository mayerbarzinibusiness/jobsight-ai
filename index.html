<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JobSight AI - Field OS</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#020617">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    /* Force Android to respect device scale and prevent automatic shrinkage */
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    
    body {
      font-size: 16px;
      background-color: #020617;
      color: #f8fafc;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* Larger touch-friendly inputs for mobile */
    input, select, textarea, button {
      font-size: 16px !important;
      -webkit-tap-highlight-color: transparent;
    }

    input[type="text"], input[type="number"], select, textarea {
      background-color: #090d16;
      border: 1px solid #1e293b;
      color: #f8fafc;
      border-radius: 0.75rem;
      padding: 0.75rem;
      width: 100%;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #f59e0b;
    }

    canvas { touch-action: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-slate-950/95 backdrop-blur border-b border-slate-800 p-3">
    <div class="max-w-3xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center space-x-2 min-w-0">
        <div class="w-9 h-9 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center shrink-0">
          <span class="text-lg">🛠️</span>
        </div>
        <div class="truncate">
          <h1 class="text-base font-bold text-amber-500 leading-tight">JobSight AI</h1>
          <p id="subHeader" class="text-[11px] text-slate-400 truncate">Field Operations Engine</p>
        </div>
      </div>

      <div class="flex items-center space-x-2 shrink-0">
        <select id="langSelect" onchange="switchLanguage(this.value)" class="!w-auto bg-slate-900 text-amber-400 text-xs font-bold px-2 py-1.5 rounded-lg">
          <option value="en">🇺🇸 EN</option>
          <option value="es">🇪🇸 ES</option>
        </select>
        <div class="flex bg-slate-900 p-1 rounded-lg border border-slate-800">
          <button onclick="switchTab('generator')" id="tabGenBtn" class="bg-amber-500 text-slate-950 text-xs font-bold px-2.5 py-1 rounded-md">Gen</button>
          <button onclick="switchTab('history')" id="tabHistBtn" class="text-slate-400 text-xs font-semibold px-2.5 py-1 rounded-md">History</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-3xl w-full mx-auto p-3 space-y-4">

    <!-- TAB 1: GENERATOR -->
    <div id="generatorTab" class="space-y-4">
      
      <!-- Section 1 -->
      <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3 shadow-lg">
        <div class="flex items-center space-x-2 border-b border-slate-800 pb-2">
          <span class="text-amber-500 font-mono text-xs font-bold">01.</span>
          <h2 id="lblDetailsTitle" class="text-xs font-bold text-amber-400 uppercase tracking-wide">Proposal Details</h2>
        </div>

        <div class="space-y-3">
          <div>
            <label id="lblCompany" class="text-xs text-slate-400 block mb-1">Company Name</label>
            <input type="text" id="companyNameInput" value="ProBuild Services">
          </div>

          <div class="grid grid-cols-1 gap-3">
            <div>
              <label id="lblClient" class="text-xs text-slate-400 block mb-1">Client Name</label>
              <input type="text" id="clientNameInput" value="John Smith">
            </div>
            <div>
              <label id="lblAddress" class="text-xs text-slate-400 block mb-1">Job Address</label>
              <input type="text" id="clientAddressInput" value="123 Maple Street, Austin TX">
            </div>
          </div>

          <div>
            <label id="lblArea" class="text-xs text-slate-400 block mb-1">Job Area / Focus</label>
            <select id="roomCategorySelect" class="text-amber-400 font-bold">
              <option value="General & Whole House">General / Whole House</option>
              <option value="Kitchen Remodel">Kitchen / Cocina</option>
              <option value="Master Bathroom">Bathroom / Baño</option>
              <option value="Exterior & Roofing">Exterior / Roofing</option>
              <option value="Basement / Addition">Basement / Adición</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Section 2 -->
      <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3 shadow-lg">
        <div class="flex items-center justify-between border-b border-slate-800 pb-2">
          <div class="flex items-center space-x-2">
            <span class="text-amber-500 font-mono text-xs font-bold">02.</span>
            <h2 id="lblNotesTitle" class="text-xs font-bold text-slate-200 uppercase tracking-wide">Walkthrough Notes</h2>
          </div>
          <div class="flex space-x-1.5">
            <label class="bg-slate-800 text-amber-400 text-xs font-bold px-2.5 py-1.5 rounded-lg cursor-pointer flex items-center space-x-1">
              <span>📷</span>
              <span id="lblAddPhoto">Photo</span>
              <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="handlePhotoUpload(event)" class="hidden">
            </label>
            <button id="micBtn" onclick="toggleVoiceRecording()" class="bg-slate-800 text-slate-300 text-xs font-bold px-2.5 py-1.5 rounded-lg flex items-center space-x-1">
              <span>🎙️</span>
              <span id="lblVoice">Voice</span>
            </button>
          </div>
        </div>

        <div id="photoPreviewWrapper" class="hidden relative inline-block">
          <img id="photoPreview" class="h-16 w-16 object-cover rounded-xl border border-amber-500">
          <button onclick="removePhoto()" class="absolute -top-2 -right-2 bg-rose-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs font-bold">✕</button>
        </div>
        
        <textarea id="notesInput" rows="4" placeholder="Type or dictate notes...&#10;Ex: Demo old cabinets, install 100 sq ft tile."></textarea>

        <button id="btnGenerate" onclick="generateEstimate()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold py-3.5 rounded-xl text-sm shadow-md uppercase tracking-wider">
          Generate Instant Estimate
        </button>
      </div>

      <!-- Section 3: Output Proposal -->
      <div id="outputWrapper" class="hidden bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-4 shadow-xl">
        <div class="flex items-center justify-between border-b border-slate-800 pb-2">
          <div class="flex items-center space-x-2">
            <span class="text-amber-500 font-mono text-xs font-bold">03.</span>
            <h2 id="lblProposalTitle" class="text-xs font-bold text-slate-200 uppercase tracking-wide">Itemized Proposal</h2>
          </div>
          <button id="btnAddItem" onclick="addNewLineItem()" class="bg-slate-800 text-amber-400 text-xs font-bold px-2.5 py-1 rounded-lg">+ Item</button>
        </div>

        <div id="outputContainer" class="space-y-3 text-xs bg-slate-950 p-3 rounded-xl border border-slate-800"></div>

        <!-- Signature Pad -->
        <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
          <div class="flex items-center justify-between">
            <span id="lblSigTitle" class="text-xs font-bold text-slate-300">Client Signature Approval</span>
            <button id="lblClearSig" onclick="clearSignature()" class="text-xs text-rose-400 underline font-semibold">Clear</button>
          </div>
          <div class="border border-slate-800 rounded-xl bg-white overflow-hidden touch-none relative">
            <canvas id="sigCanvas" class="w-full h-28 block"></canvas>
            <div id="sigPlaceholder" class="absolute inset-0 flex items-center justify-center pointer-events-none text-slate-400 text-xs italic">
              Sign here with finger or stylus
            </div>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="grid grid-cols-1 gap-2.5 pt-1">
          <button id="btnPdf" onclick="downloadPDF()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-3 rounded-xl text-xs">📄 Export PDF</button>
          <div class="grid grid-cols-2 gap-2">
            <button id="btnShare" onclick="shareProposal()" class="bg-sky-600 hover:bg-sky-500 text-white font-bold py-3 rounded-xl text-xs">📤 Share</button>
            <button id="btnSave" onclick="saveEstimate()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-xs">💾 Save Local</button>
          </div>
        </div>
      </div>

    </div>

    <!-- TAB 2: HISTORY -->
    <div id="historyTab" class="hidden space-y-4">
      <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3 shadow-lg">
        <div class="flex items-center justify-between border-b border-slate-800 pb-2">
          <h2 id="lblHistoryTitle" class="text-xs font-bold text-slate-200 uppercase">Saved Estimates</h2>
          <button id="lblRefresh" onclick="fetchHistory()" class="text-xs text-amber-500 underline font-semibold">Refresh</button>
        </div>
        <div id="historyContainer" class="space-y-2.5">
          <p id="lblNoHistory" class="text-slate-500 italic text-center py-6 text-xs">Click refresh to load history...</p>
        </div>
      </div>
    </div>

  </main>

  <footer class="border-t border-slate-900 bg-slate-950 py-3 text-center text-slate-600 text-[11px]">
    <p>JobSight AI Field OS &bull; Mobile Optimized</p>
  </footer>

  <script>
    const translations = {
      en: {
        subHeader: "Field Operations Engine",
        tabGen: "Gen",
        tabHist: "History",
        detailsTitle: "Proposal Details",
        company: "Company Name",
        client: "Client Name",
        address: "Job Address",
        area: "Job Area / Focus",
        notesTitle: "Walkthrough Notes",
        addPhoto: "Photo",
        voice: "Voice",
        generate: "Generate Instant Estimate",
        proposalTitle: "Itemized Proposal",
        addItem: "+ Item",
        sigTitle: "Client Signature Approval",
        clearSig: "Clear",
        historyTitle: "Saved Estimates",
        refresh: "Refresh",
        noHistory: "Click refresh to load history...",
        termsTitle: "Terms & Conditions:",
        termsText: "Payment due upon completion. Valid for 30 days.",
        contractorSig: "Contractor Signature",
        clientSig: "Client Approval Signature",
        subtotal: "Subtotal:",
        contingency: "Contingency (10%):",
        tax: "Est. Tax (8%):",
        grandTotal: "Grand Total:",
        sitePhotoLabel: "Site Inspection Photo:",
        sigPlaceholder: "Sign here with finger or stylus"
      },
      es: {
        subHeader: "Motor de Operaciones",
        tabGen: "Gen",
        tabHist: "Historial",
        detailsTitle: "Detalles de Propuesta",
        company: "Nombre de la Empresa",
        client: "Nombre del Cliente",
        address: "Dirección del Trabajo",
        area: "Área de Trabajo",
        notesTitle: "Notas de Inspección",
        addPhoto: "Foto",
        voice: "Voz",
        generate: "Generar Presupuesto",
        proposalTitle: "Propuesta Detallada",
        addItem: "+ Ítem",
        sigTitle: "Firma y Aprobación del Cliente",
        clearSig: "Borrar",
        historyTitle: "Presupuestos Guardados",
        refresh: "Actualizar",
        noHistory: "Haga clic en actualizar...",
        termsTitle: "Términos y Condiciones:",
        termsText: "Pago vencido al finalizar. Válido por 30 días.",
        contractorSig: "Firma del Contratista",
        clientSig: "Firma del Cliente",
        subtotal: "Subtotal:",
        contingency: "Contingencia (10%):",
        tax: "Impuesto Est. (8%):",
        grandTotal: "Gran Total:",
        sitePhotoLabel: "Foto de Inspección:",
        sigPlaceholder: "Firme aquí con el dedo"
      }
    };

    let currentLang = 'en';

    function switchLanguage(lang) {
      currentLang = lang;
      const t = translations[lang];

      document.getElementById('subHeader').innerText = t.subHeader;
      document.getElementById('tabGenBtn').innerText = t.tabGen;
      document.getElementById('tabHistBtn').innerText = t.tabHist;
      document.getElementById('lblDetailsTitle').innerText = t.detailsTitle;
      document.getElementById('lblCompany').innerText = t.company;
      document.getElementById('lblClient').innerText = t.client;
      document.getElementById('lblAddress').innerText = t.address;
      document.getElementById('lblArea').innerText = t.area;
      document.getElementById('lblNotesTitle').innerText = t.notesTitle;
      document.getElementById('lblAddPhoto').innerText = t.addPhoto;
      document.getElementById('lblVoice').innerText = t.voice;
      document.getElementById('btnGenerate').innerText = t.generate;
      document.getElementById('lblProposalTitle').innerText = t.proposalTitle;
      document.getElementById('btnAddItem').innerText = t.addItem;
      document.getElementById('lblSigTitle').innerText = t.sigTitle;
      document.getElementById('lblClearSig').innerText = t.clearSig;
      document.getElementById('lblHistoryTitle').innerText = t.historyTitle;
      document.getElementById('lblRefresh').innerText = t.refresh;
      document.getElementById('lblNoHistory').innerText = t.noHistory;
      
      const sigPlaceholder = document.getElementById('sigPlaceholder');
      if (sigPlaceholder) sigPlaceholder.innerText = t.sigPlaceholder;

      if (currentEstimate) renderEstimateUI();
    }

    const SUPABASE_URL = ''; 
    const SUPABASE_ANON_KEY = ''; 
    let supabaseClient = null;
    if (SUPABASE_URL && SUPABASE_URL.startsWith('http')) {
      try { supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch (e) {}
    }

    let currentEstimate = null;
    let currentSitePhoto = null;
    let recognition = null;
    let isRecording = false;

    let canvas, ctx, isDrawing = false, hasSigned = false;

    function initSignaturePad() {
      canvas = document.getElementById('sigCanvas');
      if (!canvas) return;
      ctx = canvas.getContext('2d');
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      canvas.addEventListener('mousedown', startDrawing);
      canvas.addEventListener('mousemove', draw);
      window.addEventListener('mouseup', stopDrawing);

      canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e.touches[0]); }, { passive: false });
      canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e.touches[0]); }, { passive: false });
      canvas.addEventListener('touchend', stopDrawing);
    }

    function resizeCanvas() {
      if (!canvas || !canvas.parentElement) return;
      const rect = canvas.parentElement.getBoundingClientRect();
      const tempImg = hasSigned ? canvas.toDataURL() : null;

      canvas.width = rect.width || 300;
      canvas.height = 110;

      ctx.strokeStyle = '#020617';
      ctx.lineWidth = 3.0;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      if (tempImg) {
        const img = new Image();
        img.onload = () => ctx.drawImage(img, 0, 0);
        img.src = tempImg;
      }
    }

    function getCanvasCoordinates(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (canvas.width / rect.width),
        y: (e.clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    function startDrawing(e) {
      isDrawing = true;
      hasSigned = true;
      document.getElementById('sigPlaceholder')?.classList.add('hidden');
      const pos = getCanvasCoordinates(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
      if (!isDrawing) return;
      const pos = getCanvasCoordinates(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDrawing() {
      isDrawing = false;
      if (currentEstimate) renderEstimateUI();
    }

    function clearSignature() {
      if (!ctx || !canvas) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      hasSigned = false;
      document.getElementById('sigPlaceholder')?.classList.remove('hidden');
      if (currentEstimate) renderEstimateUI();
    }

    window.addEventListener('DOMContentLoaded', () => { initSignaturePad(); });

    function handlePhotoUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        currentSitePhoto = e.target.result;
        document.getElementById("photoPreview").src = currentSitePhoto;
        document.getElementById("photoPreviewWrapper").classList.remove("hidden");
        if (currentEstimate) renderEstimateUI();
      };
      reader.readAsDataURL(file);
    }

    function removePhoto() {
      currentSitePhoto = null;
      document.getElementById("cameraInput").value = "";
      document.getElementById("photoPreviewWrapper").classList.add("hidden");
      if (currentEstimate) renderEstimateUI();
    }

    function toggleVoiceRecording() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) { alert("Speech recognition not supported."); return; }
      const micBtn = document.getElementById("micBtn");
      const notesInput = document.getElementById("notesInput");

      if (!isRecording) {
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = currentLang === 'es' ? 'es-ES' : 'en-US';

        recognition.onstart = () => {
          isRecording = true;
          micBtn.className = "bg-rose-600 animate-pulse text-white text-xs font-bold px-2.5 py-1.5 rounded-lg";
          micBtn.innerHTML = "<span>🔴</span> <span>Rec...</span>";
        };
        recognition.onresult = (event) => {
          let transcript = '';
          for (let i = event.resultIndex; i < event.results.length; ++i) {
            transcript += event.results[i][0].transcript;
          }
          if (transcript.trim()) {
            notesInput.value = notesInput.value + (notesInput.value ? ' ' : '') + transcript;
          }
        };
        recognition.onerror = () => { stopVoiceRecording(); };
        recognition.onend = () => { stopVoiceRecording(); };
        try { recognition.start(); } catch (err) { stopVoiceRecording(); }
      } else {
        if (recognition) recognition.stop();
        stopVoiceRecording();
      }
    }

    function stopVoiceRecording() {
      isRecording = false;
      const micBtn = document.getElementById("micBtn");
      if (micBtn) {
        micBtn.className = "bg-slate-800 text-slate-300 text-xs font-bold px-2.5 py-1.5 rounded-lg flex items-center space-x-1";
        micBtn.innerHTML = `<span>🎙️</span> <span id="lblVoice">${translations[currentLang].voice}</span>`;
      }
    }

    function switchTab(tab) {
      const genTab = document.getElementById('generatorTab');
      const histTab = document.getElementById('historyTab');
      const genBtn = document.getElementById('tabGenBtn');
      const histBtn = document.getElementById('tabHistBtn');

      if (tab === 'generator') {
        genTab.classList.remove('hidden');
        histTab.classList.add('hidden');
        genBtn.className = "bg-amber-500 text-slate-950 text-xs font-bold px-2.5 py-1 rounded-md";
        histBtn.className = "text-slate-400 text-xs font-semibold px-2.5 py-1 rounded-md";
      } else {
        genTab.classList.add('hidden');
        histTab.classList.remove('hidden');
        histBtn.className = "bg-amber-500 text-slate-950 text-xs font-bold px-2.5 py-1 rounded-md";
        genBtn.className = "text-slate-400 text-xs font-semibold px-2.5 py-1 rounded-md";
        fetchHistory();
      }
    }

    function generateEstimate() {
      const input = document.getElementById("notesInput").value;
      const companyName = document.getElementById("companyNameInput").value || "ProBuild Services";
      const clientName = document.getElementById("clientNameInput").value || "Residential Client";
      const clientAddress = document.getElementById("clientAddressInput").value || "123 Maple Street, Austin TX";
      const roomCategory = document.getElementById("roomCategorySelect").value;

      if (!input.trim()) return;

      const now = new Date();
      const formattedDate = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      const formattedTime = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      const orderNumber = `JS-${now.getFullYear()}-${Math.floor(1000 + Math.random() * 9000)}`;

      const rawLines = input.split(/[\n,.]+/);
      const items = [];
      let subtotal = 0;

      rawLines.forEach((line) => {
        const text = line.trim().toLowerCase();
        if (text.length === 0) return;

        let category = roomCategory;
        let cost = 150;
        let qty = 1;

        if (text.includes("demo") || text.includes("demolish") || text.includes("remove") || text.includes("demoler")) {
          cost = 85; qty = 8;
        } else if (text.includes("tile") || text.includes("floor") || text.includes("sq ft") || text.includes("azulejo")) {
          cost = 14; qty = 50;
        } else if (text.includes("plumb") || text.includes("vanity") || text.includes("pipe") || text.includes("sink") || text.includes("tubería")) {
          cost = 450; qty = 1;
        }

        const total = cost * qty;
        subtotal += total;
        items.push({ category, description: line.trim(), quantity: qty, unit_cost: cost, total_cost: total });
      });

      if (items.length === 0) {
        items.push({ category: roomCategory, description: input.trim(), quantity: 1, unit_cost: 250, total_cost: 250 });
        subtotal = 250;
      }

      currentEstimate = {
        order_number: orderNumber,
        company_name: companyName,
        client_name: clientName,
        client_address: clientAddress,
        room_category: roomCategory,
        created_date: formattedDate,
        created_time: formattedTime,
        language: currentLang,
        line_items: items,
        summary: { subtotal, grand_total: subtotal }
      };

      renderEstimateUI();
      setTimeout(() => {
        document.getElementById("outputWrapper")?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 100);
    }

    function renderEstimateUI() {
      if (!currentEstimate) return;
      const t = translations[currentLang];

      let subtotal = 0;
      currentEstimate.line_items.forEach(item => { subtotal += Number(item.total_cost) || 0; });
      const contingency = Math.round(subtotal * 0.10);
      const tax = Math.round(subtotal * 0.08);
      const grand_total = subtotal + contingency + tax;

      currentEstimate.summary = { subtotal, estimated_contingency: contingency, tax, grand_total };

      document.getElementById("outputWrapper").classList.remove("hidden");
      const container = document.getElementById("outputContainer");

      let html = `
        <div class="border-b border-slate-800 pb-2.5 mb-3 flex justify-between items-start gap-2">
          <div>
            <div class="flex items-center space-x-1.5 flex-wrap">
              <p class="text-amber-400 font-bold text-xs">${currentEstimate.company_name}</p>
              <span class="bg-amber-500/10 text-amber-400 border border-amber-500/30 text-[9px] px-1.5 py-0.5 rounded font-mono font-bold">${currentEstimate.order_number}</span>
            </div>
            <p class="text-[11px] text-slate-400 mt-0.5">Client: <strong class="text-slate-200">${currentEstimate.client_name}</strong></p>
          </div>
          <div class="text-right shrink-0">
            <span class="text-[10px] text-slate-400 block">${currentEstimate.created_date}</span>
          </div>
        </div>
      `;
      
      currentEstimate.line_items.forEach((item, index) => {
        html += `<div class="flex items-center justify-between border-b border-slate-900 pb-2.5 mb-2.5 gap-2">
          <div class="flex-1 min-w-0">
            <span class="text-amber-500 font-mono text-[9px] block">[${item.category}]</span> 
            <input type="text" value="${item.description}" onchange="updateItemDesc(${index}, this.value)" class="w-full bg-slate-900 text-slate-200 border border-slate-800 rounded-lg px-2 py-1.5 text-xs mt-0.5">
          </div>
          <div class="w-20 text-right shrink-0">
            <span class="text-[9px] text-slate-500 block">Total ($)</span>
            <input type="number" value="${item.total_cost}" onchange="updateItemCost(${index}, this.value)" class="w-full bg-slate-900 text-emerald-400 font-bold border border-slate-800 rounded-lg px-2 py-1.5 text-xs text-right">
          </div>
          <button onclick="removeLineItem(${index})" class="text-rose-400 p-1 text-xs mt-3 shrink-0">🗑️</button>
        </div>`;
      });

      html += `<div class="pt-2 text-xs space-y-1 border-t border-slate-800 mt-2 text-slate-400">
        <div class="flex justify-between"><span>${t.subtotal}</span><span>$${subtotal}</span></div>
        <div class="flex justify-between"><span>${t.contingency}</span><span>$${contingency}</span></div>
        <div class="flex justify-between"><span>${t.tax}</span><span>$${tax}</span></div>
        <div class="flex justify-between font-bold text-slate-100 pt-1 border-t border-slate-800 text-sm">
          <span>${t.grandTotal}</span>
          <span class="text-amber-400">$${grand_total}</span>
        </div>
      </div>`;

      if (currentSitePhoto) {
        html += `
          <div class="mt-3 pt-2.5 border-t border-slate-800">
            <p class="text-[10px] text-slate-400 font-semibold mb-1">${t.sitePhotoLabel}</p>
            <img src="${currentSitePhoto}" class="max-h-36 w-auto rounded border border-slate-800 object-contain">
          </div>
        `;
      }

      const sigDataUrl = (canvas && hasSigned) ? canvas.toDataURL() : null;
      html += `
        <div class="mt-3 pt-2.5 border-t border-slate-800 text-[10px] text-slate-400 space-y-2">
          <p class="font-semibold text-slate-300">${t.termsTitle}</p>
          <p class="leading-snug">${t.termsText}</p>
          <div class="pt-2.5 grid grid-cols-2 gap-3 items-end">
            <div><span class="text-[9px] text-slate-500 block border-b border-slate-700 pb-4">${t.contractorSig}</span></div>
            <div>
              ${sigDataUrl ? `<img src="${sigDataUrl}" class="h-8 border-b border-slate-700 pb-1">` : `<div class="border-b border-slate-700 pb-4"></div>`}
              <span class="text-[9px] text-slate-500 block pt-1">${t.clientSig}</span>
            </div>
          </div>
        </div>
      `;

      container.innerHTML = html;
    }

    function updateItemCost(index, newCost) {
      currentEstimate.line_items[index].total_cost = parseFloat(newCost) || 0;
      renderEstimateUI();
    }

    function updateItemDesc(index, newDesc) {
      currentEstimate.line_items[index].description = newDesc;
    }

    function addNewLineItem() {
      if (!currentEstimate) return;
      currentEstimate.line_items.push({
        category: currentEstimate.room_category || "General",
        description: currentLang === 'es' ? "Nuevo ítem" : "New item",
        quantity: 1,
        unit_cost: 150,
        total_cost: 150
      });
      renderEstimateUI();
    }

    function removeLineItem(index) {
      if (!currentEstimate) return;
      currentEstimate.line_items.splice(index, 1);
      renderEstimateUI();
    }

    async function saveEstimate() {
      if (!currentEstimate) return;
      const sigImage = (canvas && hasSigned) ? canvas.toDataURL() : null;
      const record = { ...currentEstimate, site_photo: currentSitePhoto, client_signature: sigImage, timestamp: Date.now() };

      let localHistory = JSON.parse(localStorage.getItem('jobsight_estimates') || '[]');
      localHistory.unshift(record);
      localStorage.setItem('jobsight_estimates', JSON.stringify(localHistory));

      if (supabaseClient) {
        try { await supabaseClient.from('estimates').insert([{ estimate_data: record }]); } catch (e) {}
      }

      alert(currentLang === 'es' ? "¡Guardado con éxito!" : "Estimate saved successfully!");
    }

    async function fetchHistory() {
      const container = document.getElementById("historyContainer");
      let allRecords = JSON.parse(localStorage.getItem('jobsight_estimates') || '[]');

      if (supabaseClient) {
        try {
          const { data } = await supabaseClient.from('estimates').select('*').order('created_at', { ascending: false });
          if (data) { data.forEach(row => { if (row.estimate_data) allRecords.push(row.estimate_data); }); }
        } catch (e) {}
      }

      if (allRecords.length > 0) {
        let html = '';
        allRecords.forEach(est => {
          html += `<div class="bg-slate-950 p-3 rounded-xl border border-slate-800 flex justify-between items-center gap-2">
            <div>
              <div class="flex items-center space-x-1.5">
                <p class="font-bold text-amber-400 text-xs">${est.company_name} - ${est.client_name}</p>
                <span class="bg-amber-500/10 text-amber-400 border border-amber-500/20 text-[9px] px-1 py-0.5 rounded font-mono">${est.order_number || '#JS-0000'}</span>
              </div>
              <p class="text-[10px] text-slate-400 mt-0.5">${est.client_address}</p>
            </div>
            <span class="font-extrabold text-emerald-400 text-xs">$${est.summary?.grand_total || 0}</span>
          </div>`;
        });
        container.innerHTML = html;
      } else {
        container.innerHTML = `<p class="text-slate-500 italic text-center py-4 text-xs">${translations[currentLang].noHistory}</p>`;
      }
    }

    function downloadPDF() {
      if (!currentEstimate) return;
      
      const pdfContainer = document.createElement('div');
      pdfContainer.style.position = 'fixed';
      pdfContainer.style.left = '-9999px';
      pdfContainer.style.top = '0';
      pdfContainer.style.background = '#ffffff';
      pdfContainer.style.color = '#000000';
      pdfContainer.style.padding = '30px';
      pdfContainer.style.fontFamily = 'Arial, sans-serif';
      pdfContainer.style.fontSize = '12px';
      pdfContainer.style.width = '700px';

      let itemsHtml = '';
      let subtotal = currentEstimate.summary.subtotal || 0;
      let contingency = currentEstimate.summary.estimated_contingency || 0;
      let tax = currentEstimate.summary.tax || 0;
      let grandTotal = currentEstimate.summary.grand_total || 0;

      currentEstimate.line_items.forEach(item => {
        itemsHtml += `
          <tr style="border-bottom: 1px solid #e2e8f0;">
            <td style="padding: 10px; color: #000000;">[${item.category}] ${item.description}</td>
            <td style="padding: 10px; text-align: right; color: #000000; font-weight: bold;">$${item.total_cost}</td>
          </tr>
        `;
      });

      const sigDataUrl = (canvas && hasSigned) ? canvas.toDataURL() : '';

      pdfContainer.innerHTML = `
        <div style="display: flex; justify-content: space-between; border-bottom: 2px solid #0f172a; padding-bottom: 15px; margin-bottom: 20px;">
          <div>
            <h2 style="margin: 0; color: #0f172a; font-size: 20px;">${currentEstimate.company_name}</h2>
            <p style="margin: 4px 0 0 0; color: #475569; font-size: 11px;">Order: <strong>${currentEstimate.order_number}</strong> | Date: ${currentEstimate.created_date}</p>
          </div>
          <div style="text-align: right;">
            <p style="margin: 0; color: #0f172a; font-size: 14px;"><strong>Client:</strong> ${currentEstimate.client_name}</p>
            <p style="margin: 4px 0 0 0; color: #475569; font-size: 11px;">${currentEstimate.client_address}</p>
          </div>
        </div>

        <h3 style="color: #0f172a; font-size: 14px; text-transform: uppercase; margin-bottom: 10px;">Itemized Estimate</h3>
        <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
          <thead>
            <tr style="background-color: #f1f5f9; border-bottom: 2px solid #cbd5e1;">
              <th style="padding: 10px; text-align: left; color: #0f172a;">Description</th>
              <th style="padding: 10px; text-align: right; color: #0f172a;">Total</th>
            </tr>
          </thead>
          <tbody>
            ${itemsHtml}
          </tbody>
        </table>

        <div style="width: 250px; margin-left: auto; margin-bottom: 25px; font-size: 13px;">
          <div style="display: flex; justify-content: space-between; padding: 4px 0; color: #334155;"><span>Subtotal:</span> <span>$${subtotal}</span></div>
          <div style="display: flex; justify-content: space-between; padding: 4px 0; color: #334155;"><span>Contingency (10%):</span> <span>$${contingency}</span></div>
          <div style="display: flex; justify-content: space-between; padding: 4px 0; color: #334155;"><span>Est. Tax (8%):</span> <span>$${tax}</span></div>
          <div style="display: flex; justify-content: space-between; padding: 8px 0; border-top: 2px solid #0f172a; font-weight: bold; color: #0f172a; font-size: 15px;">
            <span>Grand Total:</span> <span>$${grandTotal}</span>
          </div>
        </div>

        ${currentSitePhoto ? `<div style="margin-bottom: 20px;"><p style="font-weight: bold; color: #0f172a; margin-bottom: 5px;">Site Inspection Photo:</p><img src="${currentSitePhoto}" style="max-height: 180px; border-radius: 6px; border: 1px solid #cbd5e1;" /></div>` : ''}

        <div style="border-top: 1px solid #cbd5e1; padding-top: 15px; margin-top: 20px; color: #475569; font-size: 10px;">
          <p style="font-weight: bold; color: #0f172a; margin-bottom: 4px;">Terms & Conditions:</p>
          <p style="margin: 0; line-height: 1.4;">Payment due upon completion. This estimate is valid for 30 days from issuance. Any unforeseen structural damage will be billed separately upon client approval.</p>
          
          <div style="display: flex; justify-content: space-between; margin-top: 30px; align-items: flex-end;">
            <div style="width: 45%; border-top: 1px solid #0f172a; padding-top: 5px; color: #0f172a; font-weight: bold;">Contractor Signature</div>
            <div style="width: 45%;">
              ${sigDataUrl ? `<img src="${sigDataUrl}" style="height: 45px; display: block; margin-bottom: 2px;" />` : `<div style="height: 45px;"></div>`}
              <div style="border-top: 1px solid #0f172a; padding-top: 5px; color: #0f172a; font-weight: bold;">Client Approval Signature</div>
            </div>
          </div>
        </div>
      `;

      document.body.appendChild(pdfContainer);

      const opt = {
        margin: 0.3,
        filename: `JobSight_Proposal_${currentEstimate.order_number}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, scrollX: 0, scrollY: 0 },
        jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(pdfContainer).save().then(() => {
        document.body.removeChild(pdfContainer);
      }).catch(() => {
        if (document.body.contains(pdfContainer)) {
          document.body.removeChild(pdfContainer);
        }
      });
    }

    function shareProposal() {
      if (!currentEstimate) return;
      const textSummary = `*Estimate ${currentEstimate.order_number} from ${currentEstimate.company_name}*\nClient: ${currentEstimate.client_name}\nTotal: $${currentEstimate.summary.grand_total}`;
      if (navigator.share) {
        navigator.share({ title: 'JobSight Estimate', text: textSummary }).catch(() => {});
      } else {
        navigator.clipboard.writeText(textSummary);
        alert("Copied to clipboard!");
      }
    }
  </script>
</body>
</html>
