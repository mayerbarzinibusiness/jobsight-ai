<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobSight AI - Field OS</title>
  
  <!-- Progressive Web App (PWA) Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- html2pdf for client proposals -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans pb-12">
  
  <div class="max-w-md md:max-w-4xl mx-auto p-4 space-y-6">
    
    <!-- Header -->
    <header class="flex justify-between items-center border-b border-slate-800 pb-4 pt-2">
      <div>
        <h1 class="text-xl font-bold text-amber-500">JobSight AI</h1>
        <p id="subHeader" class="text-xs text-slate-400">Field Operations & Estimate Engine</p>
      </div>
      <div class="flex items-center space-x-2">
        <!-- Language Selector -->
        <select id="langSelect" onchange="switchLanguage(this.value)" class="bg-slate-900 border border-slate-800 text-amber-400 text-xs font-semibold px-2 py-1.5 rounded-lg focus:outline-none">
          <option value="en">🇺🇸 EN</option>
          <option value="es">🇪🇸 ES</option>
        </select>
        <button onclick="switchTab('generator')" id="tabGenBtn" class="bg-amber-500 text-slate-950 text-xs font-bold px-3 py-1.5 rounded-lg transition">Generator</button>
        <button onclick="switchTab('history')" id="tabHistBtn" class="bg-slate-800 text-slate-300 text-xs font-semibold px-3 py-1.5 rounded-lg transition">History</button>
      </div>
    </header>

    <!-- TAB 1: GENERATOR -->
    <div id="generatorTab" class="space-y-4">
      
      <!-- Job & Branding Details Panel -->
      <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3">
        <h2 id="lblDetailsTitle" class="text-sm font-semibold text-amber-400">1. Proposal & Branding Details</h2>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label id="lblCompany" class="text-[10px] text-slate-400 block mb-1">Contractor / Company Name</label>
            <input type="text" id="companyNameInput" value="ProBuild Services" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label id="lblClient" class="text-[10px] text-slate-400 block mb-1">Client Name</label>
            <input type="text" id="clientNameInput" value="John Smith" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 focus:outline-none focus:border-amber-500">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label id="lblAddress" class="text-[10px] text-slate-400 block mb-1">Property / Job Address</label>
            <input type="text" id="clientAddressInput" value="123 Maple Street, Austin TX" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label id="lblArea" class="text-[10px] text-slate-400 block mb-1">Job Area / Room Focus</label>
            <select id="roomCategorySelect" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-amber-400 font-bold focus:outline-none focus:border-amber-500">
              <option value="General & Whole House">General / Whole House</option>
              <option value="Kitchen Remodel">Kitchen / Cocina</option>
              <option value="Master Bathroom">Bathroom / Baño</option>
              <option value="Exterior & Roofing">Exterior / Roofing</option>
              <option value="Basement / Addition">Basement / Adición</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Walkthrough Notes Panel -->
      <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3">
        <div class="flex justify-between items-center flex-wrap gap-2">
          <h2 id="lblNotesTitle" class="text-sm font-semibold text-slate-200">2. Site Walkthrough Notes</h2>
          <div class="flex space-x-2">
            <label class="bg-slate-800 hover:bg-slate-700 text-amber-400 text-xs font-semibold px-2.5 py-1.5 rounded-lg transition cursor-pointer flex items-center space-x-1">
              <span id="lblAddPhoto">📷 Add Photo</span>
              <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="handlePhotoUpload(event)" class="hidden">
            </label>
            <button id="micBtn" onclick="toggleVoiceRecording()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold px-3 py-1.5 rounded-lg transition flex items-center space-x-1.5">
              <span>🎙️ <span id="lblVoice">Voice Dictation</span></span>
            </button>
          </div>
        </div>

        <!-- Photo Thumbnail Preview -->
        <div id="photoPreviewWrapper" class="hidden relative inline-block">
          <img id="photoPreview" class="h-20 w-20 object-cover rounded-lg border border-amber-500/50">
          <button onclick="removePhoto()" class="absolute -top-2 -right-2 bg-rose-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-[10px] font-bold shadow">✕</button>
        </div>
        
        <textarea id="notesInput" rows="4" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-amber-500" placeholder="Type or dictate notes...&#10;Ex: Demo old cabinets, install 100 sq ft tile, run new supply lines."></textarea>
        
        <button id="btnGenerate" onclick="generateEstimate()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2.5 rounded-lg text-sm transition">
          Generate Instant Estimate
        </button>
      </div>

      <!-- Output Panel -->
      <div id="outputWrapper" class="hidden bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-4">
        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
          <h2 id="lblProposalTitle" class="text-sm font-semibold text-slate-200">3. Itemized Proposal</h2>
          <button id="btnAddItem" onclick="addNewLineItem()" class="bg-slate-800 hover:bg-slate-700 text-amber-400 text-xs font-semibold px-2.5 py-1 rounded transition">
            + Add Line Item
          </button>
        </div>

        <div id="outputContainer" class="space-y-2 text-xs bg-slate-950 p-3 rounded-lg border border-slate-800"></div>
        
        <!-- Interactive Signature Pad Area -->
        <div class="bg-slate-950 p-3 rounded-lg border border-slate-800 space-y-2">
          <div class="flex justify-between items-center">
            <span id="lblSigTitle" class="text-xs font-semibold text-slate-300">Client Signature Approval</span>
            <button id="lblClearSig" onclick="clearSignature()" class="text-[10px] text-rose-400 hover:underline">Clear Sign</button>
          </div>
          <div class="border border-slate-800 rounded bg-white overflow-hidden touch-none">
            <canvas id="sigCanvas" height="100" class="w-full cursor-crosshair"></canvas>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-2 pt-2">
          <button id="btnPdf" onclick="downloadPDF()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-2 rounded-lg text-xs transition">
            📄 Export PDF
          </button>
          <button id="btnShare" onclick="shareProposal()" class="bg-sky-600 hover:bg-sky-500 text-white font-semibold py-2 rounded-lg text-xs transition">
            📤 Text / Share
          </button>
          <button id="btnSave" onclick="saveEstimate()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 rounded-lg text-xs transition">
            💾 Save Local
          </button>
        </div>
      </div>
    </div>

    <!-- TAB 2: HISTORY -->
    <div id="historyTab" class="hidden space-y-4">
      <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3">
        <div class="flex justify-between items-center">
          <h2 id="lblHistoryTitle" class="text-sm font-semibold text-slate-200">Saved Estimates</h2>
          <button id="lblRefresh" onclick="fetchHistory()" class="text-xs text-amber-500 hover:underline">Refresh</button>
        </div>
        <div id="historyContainer" class="space-y-3 text-xs">
          <p id="lblNoHistory" class="text-slate-500 italic">Click refresh to load history...</p>
        </div>
      </div>
    </div>

  </div>

  <script>
    // --- TRANSLATION DICTIONARY ---
    const translations = {
      en: {
        subHeader: "Field Operations & Estimate Engine",
        tabGen: "Generator",
        tabHist: "History",
        detailsTitle: "1. Proposal & Branding Details",
        company: "Contractor / Company Name",
        client: "Client Name",
        address: "Property / Job Address",
        area: "Job Area / Room Focus",
        notesTitle: "2. Site Walkthrough Notes",
        addPhoto: "📷 Add Photo",
        voice: "Voice Dictation",
        notesPlaceholder: "Type or dictate notes...\nEx: Demo old cabinets, install 100 sq ft tile, run new supply lines.",
        generate: "Generate Instant Estimate",
        proposalTitle: "3. Itemized Proposal",
        addItem: "+ Add Line Item",
        sigTitle: "Client Signature Approval",
        clearSig: "Clear Sign",
        btnPdf: "📄 Export PDF",
        btnShare: "📤 Text / Share",
        btnSave: "💾 Save Local",
        historyTitle: "Saved Estimates",
        refresh: "Refresh",
        noHistory: "Click refresh to load history...",
        termsTitle: "Terms & Conditions:",
        termsText: "Payment due upon completion. This estimate is valid for 30 days from issuance. Any unforeseen structural damage will be billed separately upon client approval.",
        contractorSig: "Contractor Signature",
        clientSig: "Client Approval Signature",
        subtotal: "Subtotal:",
        contingency: "Contingency (10%):",
        tax: "Est. Tax (8%):",
        grandTotal: "Grand Total:",
        sitePhotoLabel: "Site Inspection Photo:"
      },
      es: {
        subHeader: "Motor de Operaciones y Presupuestos",
        tabGen: "Generador",
        tabHist: "Historial",
        detailsTitle: "1. Detalles de Propuesta y Marca",
        company: "Nombre del Contratista / Empresa",
        client: "Nombre del Cliente",
        address: "Dirección de la Propiedad / Trabajo",
        area: "Área de Trabajo / Enfoque",
        notesTitle: "2. Notas de Inspección del Sitio",
        addPhoto: "📷 Añadir Foto",
        voice: "Dictado por Voz",
        notesPlaceholder: "Escriba o dicte las notas...\nEj: Demoler gabinetes, instalar 100 pies cuadrados de azulejo, tubería nueva.",
        generate: "Generar Presupuesto Instantáneo",
        proposalTitle: "3. Propuesta Detallada",
        addItem: "+ Añadir Ítem",
        sigTitle: "Aprobación y Firma del Cliente",
        clearSig: "Borrar Firma",
        btnPdf: "📄 Exportar PDF",
        btnShare: "📤 Enviar / Compartir",
        btnSave: "💾 Guardar Local",
        historyTitle: "Presupuestos Guardados",
        refresh: "Actualizar",
        noHistory: "Haga clic en actualizar para cargar el historial...",
        termsTitle: "Términos y Condiciones:",
        termsText: "Pago vencido al finalizar. Este presupuesto es válido por 30 días a partir de su emisión. Cualquier daño estructural imprevisto se facturará por separado.",
        contractorSig: "Firma del Contratista",
        clientSig: "Firma de Aprobación del Cliente",
        subtotal: "Subtotal:",
        contingency: "Contingencia (10%):",
        tax: "Impuesto Est. (8%):",
        grandTotal: "Gran Total:",
        sitePhotoLabel: "Foto de Inspección:"
      }
    };

    let currentLang = 'en';

    function switchLanguage(lang) {
      currentLang = lang;
      const t = translations[lang];

      document.getElementById('subHeader').innerText = t.subHeader;
      document.getElementById('tabGenBtn').innerText = t.tabGen;
      document.getElementById('tabHistBtn').innerText = t.tabHist;
      document.getElementById('lblDetailsTitle').innerText = t.detailsTitle;
      document.getElementById('lblCompany').innerText = t.company;
      document.getElementById('lblClient').innerText = t.client;
      document.getElementById('lblAddress').innerText = t.address;
      document.getElementById('lblArea').innerText = t.area;
      document.getElementById('lblNotesTitle').innerText = t.notesTitle;
      document.getElementById('lblAddPhoto').innerText = t.addPhoto;
      document.getElementById('lblVoice').innerText = t.voice;
      document.getElementById('notesInput').placeholder = t.notesPlaceholder;
      document.getElementById('btnGenerate').innerText = t.generate;
      document.getElementById('lblProposalTitle').innerText = t.proposalTitle;
      document.getElementById('btnAddItem').innerText = t.addItem;
      document.getElementById('lblSigTitle').innerText = t.sigTitle;
      document.getElementById('lblClearSig').innerText = t.clearSig;
      document.getElementById('btnPdf').innerText = t.btnPdf;
      document.getElementById('btnShare').innerText = t.btnShare;
      document.getElementById('btnSave').innerText = t.btnSave;
      document.getElementById('lblHistoryTitle').innerText = t.historyTitle;
      document.getElementById('lblRefresh').innerText = t.refresh;
      document.getElementById('lblNoHistory').innerText = t.noHistory;

      if (currentEstimate) {
        renderEstimateUI();
      }
    }

    const SUPABASE_URL = ''; 
    const SUPABASE_ANON_KEY = ''; 
    
    let supabaseClient = null;
    if (SUPABASE_URL && SUPABASE_URL.startsWith('http')) {
      try { supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch (e) {}
    }

    let currentEstimate = null;
    let currentSitePhoto = null;
    let recognition = null;
    let isRecording = false;

    // --- ROBUST SIGNATURE PAD LOGIC ---
    let canvas, ctx, isDrawing = false;

    window.addEventListener('DOMContentLoaded', () => {
      canvas = document.getElementById('sigCanvas');
      if (canvas) {
        ctx = canvas.getContext('2d');
        canvas.width = canvas.parentElement.clientWidth || 300;
        canvas.height = 100;

        ctx.strokeStyle = '#020617';
        ctx.lineWidth = 2.5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);

        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e.touches[0]); }, { passive: false });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e.touches[0]); }, { passive: false });
        canvas.addEventListener('touchend', (e) => { e.preventDefault(); stopDrawing(); });
      }
    });

    function getPosition(e, canvasElement) {
      const rect = canvasElement.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (canvasElement.width / rect.width),
        y: (e.clientY - rect.top) * (canvasElement.height / rect.height)
      };
    }

    function startDrawing(e) {
      isDrawing = true;
      const pos = getPosition(e, canvas);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
      if (!isDrawing) return;
      const pos = getPosition(e, canvas);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDrawing() { isDrawing = false; }
    function clearSignature() {
      if (!ctx || !canvas) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // --- PHOTO UPLOAD / CAMERA ---
    function handlePhotoUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        currentSitePhoto = e.target.result;
        const previewWrapper = document.getElementById("photoPreviewWrapper");
        const previewImg = document.getElementById("photoPreview");
        if (previewImg && previewWrapper) {
          previewImg.src = currentSitePhoto;
          previewWrapper.classList.remove("hidden");
        }
      };
      reader.readAsDataURL(file);
    }

    function removePhoto() {
      currentSitePhoto = null;
      document.getElementById("cameraInput").value = "";
      document.getElementById("photoPreviewWrapper").classList.add("hidden");
    }

    // --- VOICE DICTATION ---
    function toggleVoiceRecording() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Speech recognition not supported on this browser.");
        return;
      }
      const micBtn = document.getElementById("micBtn");
      const notesInput = document.getElementById("notesInput");

      if (!isRecording) {
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = currentLang === 'es' ? 'es-ES' : 'en-US';

        recognition.onstart = () => {
          isRecording = true;
          micBtn.className = "bg-rose-600 animate-pulse text-white text-xs font-bold px-3 py-1.5 rounded-lg transition flex items-center space-x-1.5";
          micBtn.innerHTML = "<span>🔴 Listening...</span>";
        };
        recognition.onresult = (event) => {
          let transcript = '';
          for (let i = event.resultIndex; i < event.results.length; ++i) {
            transcript += event.results[i][0].transcript;
          }
          if (transcript.trim()) {
            notesInput.value = notesInput.value + (notesInput.value ? ' ' : '') + transcript;
          }
        };
        recognition.onerror = () => { stopVoiceRecording(); };
        recognition.onend = () => { stopVoiceRecording(); };
        try { recognition.start(); } catch (err) { stopVoiceRecording(); }
      } else {
        if (recognition) recognition.stop();
        stopVoiceRecording();
      }
    }

    function stopVoiceRecording() {
      isRecording = false;
      const micBtn = document.getElementById("micBtn");
      if (micBtn) {
        micBtn.className = "bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold px-3 py-1.5 rounded-lg transition flex items-center space-x-1.5";
        micBtn.innerHTML = `<span>🎙️ <span id="lblVoice">${translations[currentLang].voice}</span></span>`;
      }
    }

    function switchTab(tab) {
      const genTab = document.getElementById('generatorTab');
      const histTab = document.getElementById('historyTab');
      const genBtn = document.getElementById('tabGenBtn');
      const histBtn = document.getElementById('tabHistBtn');
      const t = translations[currentLang];

      if (tab === 'generator') {
        genTab.classList.remove('hidden');
        histTab.classList.add('hidden');
        genBtn.className = "bg-amber-500 text-slate-950 text-xs font-bold px-3 py-1.5 rounded-lg transition";
        histBtn.className = "bg-slate-800 text-slate-300 text-xs font-semibold px-3 py-1.5 rounded-lg transition";
      } else {
        genTab.classList.add('hidden');
        histTab.classList.remove('hidden');
        histBtn.className = "bg-amber-500 text-slate-950 text-xs font-bold px-3 py-1.5 rounded-lg transition";
        genBtn.className = "bg-slate-800 text-slate-300 text-xs font-semibold px-3 py-1.5 rounded-lg transition";
        fetchHistory();
      }
    }

    // --- GENERATE ESTIMATE WITH ORDER NUMBER ---
    function generateEstimate() {
      const input = document.getElementById("notesInput").value;
      const companyName = document.getElementById("companyNameInput").value || "ProBuild Services";
      const clientName = document.getElementById("clientNameInput").value || "Residential Client";
      const clientAddress = document.getElementById("clientAddressInput").value || "123 Maple Street, Austin TX";
      const roomCategory = document.getElementById("roomCategorySelect").value;

      if (!input.trim()) return;

      const now = new Date();
      const formattedDate = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      const formattedTime = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      
      // Unique sequential order number generation
      const orderNumber = `JS-${now.getFullYear()}-${Math.floor(1000 + Math.random() * 9000)}`;

      const rawLines = input.split(/[\n,.]+/);
      const items = [];
      let subtotal = 0;

      rawLines.forEach((line) => {
        const text = line.trim().toLowerCase();
        if (text.length === 0) return;

        let category = roomCategory;
        let cost = 150;
        let qty = 1;

        if (text.includes("demo") || text.includes("demolish") || text.includes("remove") || text.includes("demoler")) {
          cost = 85; qty = 8;
        } else if (text.includes("tile") || text.includes("floor") || text.includes("sq ft") || text.includes("azulejo")) {
          cost = 14; qty = 50;
        } else if (text.includes("plumb") || text.includes("vanity") || text.includes("pipe") || text.includes("sink") || text.includes("tubería")) {
          cost = 450; qty = 1;
        }

        const total = cost * qty;
        subtotal += total;
        items.push({ category, description: line.trim(), quantity: qty, unit_cost: cost, total_cost: total });
      });

      if (items.length === 0) {
        items.push({ category: roomCategory, description: input.trim(), quantity: 1, unit_cost: 250, total_cost: 250 });
        subtotal = 250;
      }

      currentEstimate = {
        order_number: orderNumber,
        company_name: companyName,
        client_name: clientName,
        client_address: clientAddress,
        room_category: roomCategory,
        created_date: formattedDate,
        created_time: formattedTime,
        language: currentLang,
        line_items: items,
        summary: { subtotal, grand_total: subtotal }
      };

      renderEstimateUI();
    }

    // --- RENDER ESTIMATE UI ---
    function renderEstimateUI() {
      if (!currentEstimate) return;
      const t = translations[currentLang];

      let subtotal = 0;
      currentEstimate.line_items.forEach(item => {
        subtotal += Number(item.total_cost) || 0;
      });
      const contingency = Math.round(subtotal * 0.10);
      const tax = Math.round(subtotal * 0.08);
      const grand_total = subtotal + contingency + tax;

      currentEstimate.summary = { subtotal, estimated_contingency: contingency, tax, grand_total };

      document.getElementById("outputWrapper").classList.remove("hidden");
      const container = document.getElementById("outputContainer");

      let html = `
        <div class="border-b border-slate-800 pb-2 mb-3 flex justify-between items-start">
          <div>
            <div class="flex items-center space-x-2">
              <p class="text-amber-400 font-bold">${currentEstimate.company_name}</p>
              <span class="bg-amber-500/10 text-amber-400 border border-amber-500/20 text-[9px] px-1.5 py-0.5 rounded font-mono font-bold">${currentEstimate.order_number}</span>
            </div>
            <p class="text-[10px] text-slate-400">Client: ${currentEstimate.client_name} (${currentEstimate.client_address})</p>
            <p class="text-[9px] text-amber-500 font-mono mt-0.5">Area: ${currentEstimate.room_category}</p>
          </div>
          <div class="text-right">
            <span class="text-[10px] text-slate-400 block">${currentEstimate.created_date}</span>
            <span class="text-[9px] text-slate-500 font-mono">${currentEstimate.created_time}</span>
          </div>
        </div>
      `;
      
      currentEstimate.line_items.forEach((item, index) => {
        html += `<div class="flex items-center justify-between border-b border-slate-900/50 pb-2 mb-2 gap-2">
          <div class="flex-1">
            <span class="text-amber-500 font-mono text-[10px] block">[${item.category}]</span> 
            <input type="text" value="${item.description}" onchange="updateItemDesc(${index}, this.value)" class="w-full bg-slate-900 text-slate-200 border border-slate-800 rounded px-1.5 py-0.5 text-xs mt-0.5 focus:outline-none focus:border-amber-500">
          </div>
          <div class="w-20 text-right">
            <span class="text-[10px] text-slate-500 block">Total ($)</span>
            <input type="number" value="${item.total_cost}" onchange="updateItemCost(${index}, this.value)" class="w-full bg-slate-900 text-emerald-400 font-bold border border-slate-800 rounded px-1.5 py-0.5 text-xs text-right focus:outline-none focus:border-amber-500">
          </div>
          <button onclick="removeLineItem(${index})" class="text-rose-400 hover:text-rose-300 px-1 py-1 text-xs mt-3" title="Delete item">🗑️</button>
        </div>`;
      });

      html += `<div class="pt-2 text-xs space-y-1 border-t border-slate-800 mt-3 text-slate-400">
        <div class="flex justify-between"><span>${t.subtotal}</span><span>$${subtotal}</span></div>
        <div class="flex justify-between"><span>${t.contingency}</span><span>$${contingency}</span></div>
        <div class="flex justify-between"><span>${t.tax}</span><span>$${tax}</span></div>
        <div class="flex justify-between font-bold text-slate-100 pt-1 border-t border-slate-900 text-sm">
          <span>${t.grandTotal}</span>
          <span class="text-amber-400">$${grand_total}</span>
        </div>
      </div>`;

      if (currentSitePhoto) {
        html += `
          <div class="mt-3 pt-3 border-t border-slate-800">
            <p class="text-[10px] text-slate-400 font-semibold mb-1">${t.sitePhotoLabel}</p>
            <img src="${currentSitePhoto}" class="max-h-40 w-auto rounded border border-slate-800 object-contain">
          </div>
        `;
      }

      const sigDataUrl = canvas ? canvas.toDataURL() : null;
      html += `
        <div class="mt-4 pt-3 border-t border-slate-800 text-[10px] text-slate-400 space-y-2">
          <p class="font-semibold text-slate-300">${t.termsTitle}</p>
          <p>${t.termsText}</p>
          <div class="pt-3 grid grid-cols-2 gap-4 items-end">
            <div><span class="text-[9px] text-slate-500 block border-b border-slate-700 pb-4">${t.contractorSig}</span></div>
            <div>
              ${canvas ? `<img src="${sigDataUrl}" class="h-10 border-b border-slate-700 pb-1">` : `<div class="border-b border-slate-700 pb-6"></div>`}
              <span class="text-[9px] text-slate-500 block pt-1">${t.clientSig}</span>
            </div>
          </div>
        </div>
      `;

      container.innerHTML = html;
    }

    function updateItemCost(index, newCost) {
      currentEstimate.line_items[index].total_cost = parseFloat(newCost) || 0;
      renderEstimateUI();
    }

    function updateItemDesc(index, newDesc) {
      currentEstimate.line_items[index].description = newDesc;
    }

    function addNewLineItem() {
      if (!currentEstimate) return;
      currentEstimate.line_items.push({
        category: currentEstimate.room_category || "General",
        description: currentLang === 'es' ? "Nuevo ítem personalizado" : "New custom work item",
        quantity: 1,
        unit_cost: 150,
        total_cost: 150
      });
      renderEstimateUI();
    }

    function removeLineItem(index) {
      if (!currentEstimate) return;
      currentEstimate.line_items.splice(index, 1);
      renderEstimateUI();
    }

    // --- SAVE & HISTORY ---
    async function saveEstimate() {
      if (!currentEstimate) return;

      const sigImage = canvas ? canvas.toDataURL() : null;
      const record = { ...currentEstimate, site_photo: currentSitePhoto, client_signature: sigImage, timestamp: Date.now() };

      let localHistory = JSON.parse(localStorage.getItem('jobsight_estimates') || '[]');
      localHistory.unshift(record);
      localStorage.setItem('jobsight_estimates', JSON.stringify(localHistory));

      if (supabaseClient) {
        try {
          await supabaseClient.from('estimates').insert([{ estimate_data: record }]);
        } catch (e) {}
      }

      alert(currentLang === 'es' ? "¡Presupuesto guardado con éxito!" : "Estimate successfully saved!");
    }
