<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobSight AI - Field OS</title>
  
  <!-- Progressive Web App (PWA) Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- html2pdf for client proposals -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans pb-12">
  
  <div class="max-w-md md:max-w-4xl mx-auto p-4 space-y-6">
    
    <!-- Header -->
    <header class="flex justify-between items-center border-b border-slate-800 pb-4 pt-2">
      <div>
        <h1 class="text-xl font-bold text-amber-500">JobSight AI</h1>
        <p class="text-xs text-slate-400">Field Operations & Estimate Engine</p>
      </div>
      <div class="flex space-x-2">
        <button onclick="switchTab('generator')" id="tabGenBtn" class="bg-amber-500 text-slate-950 text-xs font-bold px-3 py-1.5 rounded-lg transition">Generator</button>
        <button onclick="switchTab('history')" id="tabHistBtn" class="bg-slate-800 text-slate-300 text-xs font-semibold px-3 py-1.5 rounded-lg transition">History</button>
      </div>
    </header>

    <!-- TAB 1: GENERATOR -->
    <div id="generatorTab" class="space-y-4">
      
      <!-- Job & Branding Details Panel -->
      <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3">
        <h2 class="text-sm font-semibold text-amber-400">1. Proposal & Branding Details</h2>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[10px] text-slate-400 block mb-1">Contractor / Company Name</label>
            <input type="text" id="companyNameInput" value="ProBuild Services" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="text-[10px] text-slate-400 block mb-1">Client Name</label>
            <input type="text" id="clientNameInput" value="John Smith" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 focus:outline-none focus:border-amber-500">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[10px] text-slate-400 block mb-1">Property / Job Address</label>
            <input type="text" id="clientAddressInput" value="123 Maple Street, Austin TX" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="text-[10px] text-slate-400 block mb-1">Job Area / Room Focus</label>
            <select id="roomCategorySelect" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-amber-400 font-bold focus:outline-none focus:border-amber-500">
              <option value="General & Whole House">General / Whole House</option>
              <option value="Kitchen Remodel">Kitchen</option>
              <option value="Master Bathroom">Master Bathroom</option>
              <option value="Exterior & Roofing">Exterior / Roofing</option>
              <option value="Basement / Addition">Basement / Addition</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Walkthrough Notes Panel -->
      <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3">
        <div class="flex justify-between items-center flex-wrap gap-2">
          <h2 class="text-sm font-semibold text-slate-200">2. Site Walkthrough Notes</h2>
          <div class="flex space-x-2">
            <label class="bg-slate-800 hover:bg-slate-700 text-amber-400 text-xs font-semibold px-2.5 py-1.5 rounded-lg transition cursor-pointer flex items-center space-x-1">
              <span>📷 Add Photo</span>
              <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="handlePhotoUpload(event)" class="hidden">
            </label>
            <button id="micBtn" onclick="toggleVoiceRecording()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold px-3 py-1.5 rounded-lg transition flex items-center space-x-1.5">
              <span>🎙️ Voice Dictation</span>
            </button>
          </div>
        </div>

        <!-- Photo Thumbnail Preview -->
        <div id="photoPreviewWrapper" class="hidden relative inline-block">
          <img id="photoPreview" class="h-20 w-20 object-cover rounded-lg border border-amber-500/50">
          <button onclick="removePhoto()" class="absolute -top-2 -right-2 bg-rose-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-[10px] font-bold shadow">✕</button>
        </div>
        
        <textarea id="notesInput" rows="4" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-amber-500" placeholder="Type or dictate notes...&#10;Ex: Demo old cabinets, install 100 sq ft tile, run new supply lines."></textarea>
        
        <button onclick="generateEstimate()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2.5 rounded-lg text-sm transition">
          Generate Instant Estimate
        </button>
      </div>

      <!-- Output Panel -->
      <div id="outputWrapper" class="hidden bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-4">
        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
          <h2 class="text-sm font-semibold text-slate-200">3. Itemized Proposal</h2>
          <button onclick="addNewLineItem()" class="bg-slate-800 hover:bg-slate-700 text-amber-400 text-xs font-semibold px-2.5 py-1 rounded transition">
            + Add Line Item
          </button>
        </div>

        <div id="outputContainer" class="space-y-2 text-xs bg-slate-950 p-3 rounded-lg border border-slate-800"></div>
        
        <!-- Interactive Signature Pad Area -->
        <div class="bg-slate-950 p-3 rounded-lg border border-slate-800 space-y-2">
          <div class="flex justify-between items-center">
            <span class="text-xs font-semibold text-slate-300">Client Signature Approval</span>
            <button onclick="clearSignature()" class="text-[10px] text-rose-400 hover:underline">Clear Sign</button>
          </div>
          <div class="border border-slate-800 rounded bg-white overflow-hidden touch-none">
            <canvas id="sigCanvas" height="100" class="w-full cursor-crosshair"></canvas>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-2 pt-2">
          <button onclick="downloadPDF()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-2 rounded-lg text-xs transition">
            📄 Export PDF
          </button>
          <button onclick="shareProposal()" class="bg-sky-600 hover:bg-sky-500 text-white font-semibold py-2 rounded-lg text-xs transition">
            📤 Text / Share
          </button>
          <button onclick="saveEstimate()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 rounded-lg text-xs transition">
            💾 Save Local
          </button>
        </div>
      </div>
    </div>

    <!-- TAB 2: HISTORY -->
    <div id="historyTab" class="hidden space-y-4">
      <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="text-sm font-semibold text-slate-200">Saved Estimates (Local & Cloud)</h2>
          <button onclick="fetchHistory()" class="text-xs text-amber-500 hover:underline">Refresh</button>
        </div>
        <div id="historyContainer" class="space-y-3 text-xs">
          <p class="text-slate-500 italic">Click refresh to load history...</p>
        </div>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = ''; 
    const SUPABASE_ANON_KEY = ''; 
    
    let supabaseClient = null;
    if (SUPABASE_URL && SUPABASE_URL.startsWith('http')) {
      try { supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch (e) {}
    }

    let currentEstimate = null;
    let currentSitePhoto = null;
    let recognition = null;
    let isRecording = false;

    // --- ROBUST SIGNATURE PAD LOGIC ---
    let canvas, ctx, isDrawing = false;

    window.addEventListener('DOMContentLoaded', () => {
      canvas = document.getElementById('sigCanvas');
      if (canvas) {
        ctx = canvas.getContext('2d');
        
        canvas.width = canvas.parentElement.clientWidth || 300;
        canvas.height = 100;

        ctx.strokeStyle = '#020617';
        ctx.lineWidth = 2.5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // Mouse Events
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);

        // Touch Events for Mobile / Tablets
        canvas.addEventListener('touchstart', (e) => {
          e.preventDefault();
          startDrawing(e.touches[0]);
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
          e.preventDefault();
          draw(e.touches[0]);
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
          e.preventDefault();
          stopDrawing();
        });
      }
    });

    function getPosition(e, canvasElement) {
      const rect = canvasElement.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (canvasElement.width / rect.width),
        y: (e.clientY - rect.top) * (canvasElement.height / rect.height)
      };
    }

    function startDrawing(e) {
      isDrawing = true;
      const pos = getPosition(e, canvas);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
      if (!isDrawing) return;
      const pos = getPosition(e, canvas);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDrawing() {
      isDrawing = false;
    }

    function clearSignature() {
      if (!ctx || !canvas) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // --- PHOTO UPLOAD / CAMERA ---
    function handlePhotoUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        currentSitePhoto = e.target.result;
        const previewWrapper = document.getElementById("photoPreviewWrapper");
        const previewImg = document.getElementById("photoPreview");
        if (previewImg && previewWrapper) {
          previewImg.src = currentSitePhoto;
          previewWrapper.classList.remove("hidden");
        }
      };
      reader.readAsDataURL(file);
    }

    function removePhoto() {
      currentSitePhoto = null;
      document.getElementById("cameraInput").value = "";
      document.getElementById("photoPreviewWrapper").classList.add("hidden");
    }

    // --- VOICE DICTATION ---
    function toggleVoiceRecording() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Speech recognition not supported on this browser.");
        return;
      }
      const micBtn = document.getElementById("micBtn");
      const notesInput = document.getElementById("notesInput");

      if (!isRecording) {
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'en-US';

        recognition.onstart = () => {
          isRecording = true;
          micBtn.className = "bg-rose-600 animate-pulse text-white text-xs font-bold px-3 py-1.5 rounded-lg transition flex items-center space-x-1.5";
          micBtn.innerHTML = "<span>🔴 Listening...</span>";
        };
        recognition.onresult = (event) => {
          let transcript = '';
          for (let i = event.resultIndex; i < event.results.length; ++i) {
            transcript += event.results[i][0].transcript;
          }
          if (transcript.trim()) {
            notesInput.value = notesInput.value + (notesInput.value ? ' ' : '') + transcript;
          }
        };
        recognition.onerror = () => { stopVoiceRecording(); };
        recognition.onend = () => { stopVoiceRecording(); };
        try { recognition.start(); } catch (err) { stopVoiceRecording(); }
      } else {
        if (recognition) recognition.stop();
        stopVoiceRecording();
      }
    }

    function stopVoiceRecording() {
      isRecording = false;
      const micBtn = document.getElementById("micBtn");
      if (micBtn) {
        micBtn.className = "bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold px-3 py-1.5 rounded-lg transition flex items-center space-x-1.5";
        micBtn.innerHTML = "<span>🎙️ Voice Dictation</span>";
      }
    }

    function switchTab(tab) {
      const genTab = document.getElementById('generatorTab');
      const histTab = document.getElementById('historyTab');
      const genBtn = document.getElementById('tabGenBtn');
      const histBtn = document.getElementById('tabHistBtn');

      if (tab === 'generator') {
        genTab.classList.remove('hidden');
        histTab.classList.add('hidden');
        genBtn.className = "bg-amber-500 text-slate-950 text-xs font-bold px-3 py-1.5 rounded-lg transition";
        histBtn.className = "bg-slate-800 text-slate-300 text-xs font-semibold px-3 py-1.5 rounded-lg transition";
      } else {
        genTab.classList.add('hidden');
        histTab.classList.remove('hidden');
        histBtn.className = "bg-amber-500 text-slate-950 text-xs font-bold px-3 py-1.5 rounded-lg transition";
        genBtn.className = "bg-slate-800 text-slate-300 text-xs font-semibold px-3 py-1.5 rounded-lg transition";
        fetchHistory();
      }
    }

    // --- GENERATE ESTIMATE ---
    function generateEstimate() {
      const input = document.getElementById("notesInput").value;
      const companyName = document.getElementById("companyNameInput").value || "ProBuild Services";
      const clientName = document.getElementById("clientNameInput").value || "Residential Client";
      const clientAddress = document.getElementById("clientAddressInput").value || "123 Maple Street, Austin TX";
      const roomCategory = document.getElementById("roomCategorySelect").value;

      if (!input.trim()) return;

      const now = new Date();
      const formattedDate = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      const formattedTime = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

      const rawLines = input.split(/[\n,.]+/);
      const items = [];
      let subtotal = 0;

      rawLines.forEach((line) => {
        const text = line.trim().toLowerCase();
        if (text.length === 0) return;

        let category = roomCategory;
        let cost = 150;
        let qty = 1;

        if (text.includes("demo") || text.includes("demolish") || text.includes("remove")) {
          cost = 85; qty = 8;
        } else if (text.includes("tile") || text.includes("floor") || text.includes("sq ft")) {
          cost = 14; qty = 50;
        } else if (text.includes("plumb") || text.includes("vanity") || text.includes("pipe") || text.includes("sink")) {
          cost = 450; qty = 1;
        }

        const total = cost * qty;
        subtotal += total;
        items.push({ category, description: line.trim(), quantity: qty, unit_cost: cost, total_cost: total });
      });

      if (items.length === 0) {
        items.push({ category: roomCategory, description: input.trim(), quantity: 1, unit_cost: 250, total_cost: 250 });
        subtotal = 250;
      }

      currentEstimate = {
        company_name: companyName,
        client_name: clientName,
        client_address: clientAddress,
        room_category: roomCategory,
        created_date: formattedDate,
        created_time: formattedTime,
        line_items: items,
        summary: { subtotal, grand_total: subtotal }
      };

      renderEstimateUI();
    }

    // --- RENDER ESTIMATE & EDIT CONTROLS ---
    function renderEstimateUI() {
      if (!currentEstimate) return;

      let subtotal = 0;
      currentEstimate.line_items.forEach(item => {
        subtotal += Number(item.total_cost) || 0;
      });
      const contingency = Math.round(subtotal * 0.10);
      const tax = Math.round(subtotal * 0.08);
      const grand_total = subtotal + contingency + tax;

      currentEstimate.summary = { subtotal, estimated_contingency: contingency, tax, grand_total };

      document.getElementById("outputWrapper").classList.remove("hidden");
      const container = document.getElementById("outputContainer");

      let html = `
        <div class="border-b border-slate-800 pb-2 mb-3 flex justify-between items-start">
          <div>
            <p class="text-amber-400 font-bold">${currentEstimate.company_name}</p>
            <p class="text-[10px] text-slate-400">Client: ${currentEstimate.client_name} (${currentEstimate.client_address})</p>
            <p class="text-[9px] text-amber-500 font-mono mt-0.5">Area: ${currentEstimate.room_category}</p>
          </div>
          <div class="text-right">
            <span class="text-[10px] text-slate-400 block">${currentEstimate.created_date}</span>
            <span class="text-[9px] text-slate-500 font-mono">${currentEstimate.created_time}</span>
          </div>
        </div>
      `;
      
      currentEstimate.line_items.forEach((item, index) => {
        html += `<div class="flex items-center justify-between border-b border-slate-900/50 pb-2 mb-2 gap-2">
          <div class="flex-1">
            <span class="text-amber-500 font-mono text-[10px] block">[${item.category}]</span> 
            <input type="text" value="${item.description}" onchange="updateItemDesc(${index}, this.value)" class="w-full bg-slate-900 text-slate-200 border border-slate-800 rounded px-1.5 py-0.5 text-xs mt-0.5 focus:outline-none focus:border-amber-500">
          </div>
          <div class="w-20 text-right">
            <span class="text-[10px] text-slate-500 block">Total ($)</span>
            <input type="number" value="${item.total_cost}" onchange="updateItemCost(${index}, this.value)" class="w-full bg-slate-900 text-emerald-400 font-bold border border-slate-800 rounded px-1.5 py-0.5 text-xs text-right focus:outline-none focus:border-amber-500">
          </div>
          <button onclick="removeLineItem(${index})" class="text-rose-400 hover:text-rose-300 px-1 py-1 text-xs mt-3" title="Delete item">🗑️</button>
        </div>`;
      });

      html += `<div class="pt-2 text-xs space-y-1 border-t border-slate-800 mt-3 text-slate-400">
        <div class="flex justify-between"><span>Subtotal:</span><span>$${subtotal}</span></div>
        <div class="flex justify-between"><span>Contingency (10%):</span><span>$${contingency}</span></div>
        <div class="flex justify-between"><span>Est. Tax (8%):</span><span>$${tax}</span></div>
        <div class="flex justify-between font-bold text-slate-100 pt-1 border-t border-slate-900 text-sm">
          <span>Grand Total:</span>
          <span class="text-amber-400">$${grand_total}</span>
        </div>
      </div>`;

      // Photo Attachment Rendering
      if (currentSitePhoto) {
        html += `
          <div class="mt-3 pt-3 border-t border-slate-800">
            <p class="text-[10px] text-slate-400 font-semibold mb-1">Site Inspection Photo:</p>
            <img src="${currentSitePhoto}" class="max-h-40 w-auto rounded border border-slate-800 object-contain">
          </div>
        `;
      }

      // Terms & Signature Display
      const sigDataUrl = canvas ? canvas.toDataURL() : null;
      html += `
        <div class="mt-4 pt-3 border-t border-slate-800 text-[10px] text-slate-400 space-y-2">
          <p class="font-semibold text-slate-300">Terms & Conditions:</p>
          <p>Payment due upon completion. This estimate is valid for 30 days from issuance. Any unforeseen structural damage will be billed separately upon client approval.</p>
          <div class="pt-3 grid grid-cols-2 gap-4 items-end">
            <div><span class="text-[9px] text-slate-500 block border-b border-slate-700 pb-4">Contractor Signature</span></div>
            <div>
              ${canvas ? `<img src="${sigDataUrl}" class="h-10 border-b border-slate-700 pb-1">` : `<div class="border-b border-slate-700 pb-6"></div>`}
              <span class="text-[9px] text-slate-500 block pt-1">Client Approval Signature</span>
            </div>
          </div>
        </div>
      `;

      container.innerHTML = html;
    }

    function updateItemCost(index, newCost) {
      currentEstimate.line_items[index].total_cost = parseFloat(newCost) || 0;
      renderEstimateUI();
    }

    function updateItemDesc(index, newDesc) {
      currentEstimate.line_items[index].description = newDesc;
    }

    function addNewLineItem() {
      if (!currentEstimate) return;
      currentEstimate.line_items.push({
        category: currentEstimate.room_category || "General",
        description: "New custom work item",
        quantity: 1,
        unit_cost: 150,
        total_cost: 150
      });
      renderEstimateUI();
    }

    function removeLineItem(index) {
      if (!currentEstimate) return;
      currentEstimate.line_items.splice(index, 1);
      renderEstimateUI();
    }

    // --- LOCAL STORAGE & DATABASE SAVE ---
    async function saveEstimate() {
      if (!currentEstimate) return;

      const sigImage = canvas ? canvas.toDataURL() : null;
      const record = { ...currentEstimate, site_photo: currentSitePhoto, client_signature: sigImage, timestamp: Date.now() };

      let localHistory = JSON.parse(localStorage.getItem('jobsight_estimates') || '[]');
      localHistory.unshift(record);
      localStorage.setItem('jobsight_estimates', JSON.stringify(localHistory));

      if (supabaseClient) {
        try {
          await supabaseClient.from('estimates').insert([{ estimate_data: record }]);
        } catch (e) {}
      }

      alert("Estimate successfully saved locally and to history!");
    }

    async function fetchHistory() {
      const container = document.getElementById("historyContainer");
      let allRecords = [];

      const localHistory = JSON.parse(localStorage.getItem('jobsight_estimates') || '[]');
      allRecords = [...localHistory];

      if (supabaseClient) {
        try {
          const { data } = await supabaseClient.from('estimates').select('*').order('created_at', { ascending: false });
          if (data) {
            data.forEach(row => { if (row.estimate_data) allRecords.push(row.estimate_data); });
          }
        } catch (e) {}
      }

      if (allRecords.length > 0) {
        let html = '';
        allRecords.forEach(est => {
          html += `<div class="bg-slate-950 p-3 rounded-lg border border-slate-800 flex justify-between items-center">
            <div>
              <p class="font-bold text-amber-400">${est.company_name} - ${est.client_name}</p>
              <p class="text-[10px] text-slate-400">${est.client_address} (${est.room_category || 'General'})</p>
              <p class="text-[9px] text-slate-500 mt-0.5">${est.created_date || ''} at ${est.created_time || ''}</p>
            </div>
            <span class="font-bold text-emerald-400">$${est.summary?.grand_total || 0}</span>
          </div>`;
        });
        container.innerHTML = html;
      } else {
        container.innerHTML = `<p class="text-slate-500 italic">No saved estimates found yet. Generate and save one!</p>`;
      }
    }

    function downloadPDF() {
      const element = document.getElementById('outputContainer');
      const opt = {
        margin: 0.4,
        filename: `JobSight_Proposal_${Date.now()}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
      };
      html2pdf().set(opt).from(element).save();
    }

    function shareProposal() {
      if (!currentEstimate) return;
      const textSummary = `*Estimate from ${currentEstimate.company_name}* (${currentEstimate.room_category})\nDate: ${currentEstimate.created_date}\nClient: ${currentEstimate.client_name}\nLocation: ${currentEstimate.client_address}\nGrand Total: $${currentEstimate.summary.grand_total}\n\nGenerated via JobSight AI.`;
      
      if (navigator.share) {
        navigator.share({
          title: 'JobSight Estimate',
          text: textSummary,
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(textSummary);
        alert("Estimate summary copied to clipboard!");
      }
    }
  </script>
</body>
</html>
